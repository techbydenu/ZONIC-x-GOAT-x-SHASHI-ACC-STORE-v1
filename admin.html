<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; text-align: center; }
        .box { max-width: 400px; margin: 80px auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
        input { width: 90%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; text-align: center; }
        button { width: 95%; padding: 12px; background: #f59e0b; color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .hidden { display: none; }
        .admin-card { background: #0f172a; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #334155; }
        .sheet-btn { display: inline-block; padding: 12px 20px; background: #22c55e; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 15px; }
        .back-btn { display: inline-block; margin-bottom: 15px; color: #f59e0b; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. LOGIN FORM -->
    <div id="loginBox" class="box">
        <a href="index.html" class="back-btn">⬅️ Back to Website</a>
        <h2 style="color: #f59e0b; margin-top: 10px;">🔐 Admin Login</h2>
        <p style="font-size: 14px; color: #94a3b8;">කරුණාකර Admin Password එක ඇතුළත් කරන්න:</p>
        
        <input type="password" id="adminPass" placeholder="Enter Password">
        <button onclick="checkAdminPassword()">Login</button>
        <p id="errorMsg" style="color: #ef4444; font-size: 14px; margin-top: 10px;" class="hidden">⚠️ මුරපදය වැරදියි!</p>
    </div>

    <!-- 2. ADMIN DASHBOARD (AFTER LOGIN) -->
    <div id="adminDashboard" class="box hidden" style="max-width: 600px;">
        <h2 style="color: #f59e0b;">⚡ Welcome Admin</h2>
        <p style="color: #94a3b8;">ඔබ සාර්ථකව Admin Panel එකට Log විය.</p>

        <div class="admin-card">
            <h3>📊 Google Sheet Control</h3>
            <p style="font-size: 13px; color: #cbd5e1;">ගෙවීම් විස්තර වෙනස් කිරීමට සහ Reviews පරීක්ෂා කිරීමට Sheet එක Open කරන්න:</p>
            <a href="https://docs.google.com/spreadsheets/d/1-XA5ecvIW-5xHjA8i82nnc4ETZAWTaJ77UChAtTAQdA/edit" target="_blank" class="sheet-btn">
                📂 Open Google Sheet
            </a>
        </div>

        <button onclick="logoutAdmin()" style="background: #ef4444; color: #fff; margin-top: 20px;">Logout</button>
    </div>

    <script>
        // Set Your Admin Password Here
        const ADMIN_PASSWORD = "1234"; // Default Password

        if (sessionStorage.getItem("adminLoggedIn") === "true") {
            showDashboard();
        }

        function checkAdminPassword() {
            const enteredPass = document.getElementById('adminPass').value;
            const errorMsg = document.getElementById('errorMsg');

            if (enteredPass === ADMIN_PASSWORD) {
                sessionStorage.setItem("adminLoggedIn", "true");
                showDashboard();
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function showDashboard() {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
        }

        function logoutAdmin() {
            sessionStorage.removeItem("adminLoggedIn");
            location.reload();
        }
    </script>

</body>
</html>
